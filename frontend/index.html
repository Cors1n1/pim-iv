  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var hasImp = params.has('impersonate_token');
        var hasTok = !!localStorage.getItem('sgc_token');
        if (hasImp || hasTok) {
          document.documentElement.classList.add('is-preauth');
        }
        var prefs = JSON.parse(localStorage.getItem('sgc_prefs') || '{}');
        if (prefs.dark) {
          document.documentElement.classList.add('dark-mode');
        }
        if (prefs.contrast) {
          document.documentElement.classList.add('high-contrast');
        }
      } catch (e) {}
    })();
  </script>

  <script>
    (function() {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        document.documentElement.classList.add('is-ios-device');
      }
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        if (!isIOS) {
          var btn = document.getElementById('btnInstallPwa');
          if (btn) btn.classList.remove('hidden');
          var navBtn = document.getElementById('navInstallApp');
          if (navBtn) navBtn.classList.remove('hidden');
          var banner = document.getElementById('pwaOverviewBanner');
          if (banner) banner.classList.remove('hidden');
        }
      });
    })();

  <!-- Carregador Modular Assíncrono (Component-Based Architecture) -->
  <script>
    (async function initModularApp() {
      const components = [
        ['mount-topbar', '/components/topbar.html'],
        ['mount-sidebar', '/components/sidebar.html'],
        ['mount-bottomnav', '/components/bottom_nav.html'],
        ['mount-login', '/modules/auth_login.html'],
        ['mount-overview', '/modules/visao_geral.html'],
        ['mount-units', '/modules/unidades.html'],
        ['mount-deliveries', '/modules/encomendas.html'],
        ['mount-reservations', '/modules/reservas.html'],
        ['mount-notices', '/modules/mural_avisos.html'],
        ['mount-audit', '/modules/auditoria.html'],
        ['mount-tickets', '/modules/ocorrencias.html'],
        ['mount-visitors', '/modules/portaria_visitantes.html'],
        ['mount-settings', '/modules/configuracoes.html'],
        ['mount-modal-guests', '/modals/convidados_modal.html'],
        ['mount-modal-reply', '/modals/resposta_ocorrencia_modal.html'],
        ['mount-modal-confirm', '/modals/confirm_dialog_modal.html'],
        ['mount-modal-password', '/modals/troca_senha_modal.html'],
        ['mount-modal-suspended', '/modals/suspensao_modal.html'],
        ['mount-modal-invite-resident', '/modals/convite_morador_modal.html'],
        ['mount-modal-day-reservations', '/modals/reservas_dia_modal.html']
      ];

      try {
        await Promise.all(components.map(async ([mountId, filePath]) => {
          const res = await fetch(`${filePath}?v=57`);
          if (!res.ok) throw new Error(`Falha ao carregar componente: ${filePath} (${res.status})`);
          const html = await res.text();
          const target = document.getElementById(mountId);
          if (target) {
            target.outerHTML = html;
          }
        }));
      } catch (err) {
        console.error('[Arquitetura Modular] Erro ao carregar componentes parciais:', err);
      } finally {
        const script = document.createElement('script');
        script.src = '/app.js?v=57';
        document.body.appendChild(script);
      }
    })();
  </script>
